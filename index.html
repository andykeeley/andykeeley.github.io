<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>things i've built</title>
<meta name="description" content="Andy Keeley: AI in commercial operations, and at home. Built with Claude Code by a commercial leader who isn't a developer.">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f4f0;
    --surface: #fff;
    --text: #161616;
    --secondary: #3a3a3a;
    --muted: #6b6a66;
    --faint: #e2e0db;
    --border: #d3d1ca;
    --border-strong: #a9a69e;
    --green: #177a45;
    --amber: #8f6100;
    --red: #b83636;
    --green-fill: #22a45d;
    --amber-fill: #d4930d;
    --red-fill: #c43d3d;
    --tag-bg: #eeece6;
    --img-bg: #e8e6e0;
    --radius: 12px;
    --radius-sm: 8px;
    --shadow: 0 1px 2px rgba(0,0,0,0.04);
    --focus: #2d5bd8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #131314;
      --surface: #1c1c1e;
      --text: #ededed;
      --secondary: #c9c9c9;
      --muted: #9a9a9a;
      --faint: #2c2c2e;
      --border: #333336;
      --border-strong: #5c5c60;
      --green: #4cc583;
      --amber: #e5ab3a;
      --red: #e36b6b;
      --tag-bg: #26262a;
      --img-bg: #232325;
      --shadow: none;
      --focus: #7aa2ff;
    }
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    font-size: 16px;
    font-weight: 400;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    padding: 0 24px;
  }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
  .page {
    max-width: 1100px;
    margin: 0 auto;
    padding: 72px 0 120px;
    animation: fade 0.5s ease both;
  }

  /* HEADER */
  .header { margin-bottom: 40px; }
  .header h1 {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 28px;
    font-weight: 500;
    letter-spacing: -0.5px;
    line-height: 1.2;
  }
  .header .tagline {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 15px;
    color: var(--secondary);
    margin-top: 6px;
  }
  .header .meta {
    margin-top: 20px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    color: var(--secondary);
    display: flex;
    flex-wrap: wrap;
    gap: 6px 18px;
  }
  .header .meta a {
    color: var(--text);
    font-weight: 500;
    text-decoration: underline;
    text-underline-offset: 4px;
    text-decoration-color: var(--border-strong);
  }
  .header .meta a:hover { text-decoration-color: var(--text); }

  .intro { max-width: 640px; margin-bottom: 64px; }
  .intro p { font-size: 17px; color: var(--secondary); line-height: 1.7; }
  .intro p + p { margin-top: 16px; }
  .intro p:first-child { color: var(--text); }

  hr { border: none; border-top: 1px solid var(--faint); margin: 56px 0; }

  /* SECTIONS */
  .section { margin-bottom: 72px; }
  .section-head { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
  .section-title {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 20px;
    font-weight: 500;
  }
  .section-framing { font-size: 15px; color: var(--secondary); }
  .small-title {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px;
    font-weight: 500;
    color: var(--secondary);
    margin-bottom: 16px;
  }

  /* CARDS */
  .grid { display: grid; gap: 20px; }
  .grid-work { grid-template-columns: repeat(2, 1fr); }
  .grid-home { grid-template-columns: repeat(3, 1fr); gap: 14px; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    cursor: pointer;
    text-align: left;
    color: inherit;
    font: inherit;
    transition: border-color 0.2s ease;
  }
  .card:hover { border-color: var(--border-strong); }
  .card:focus-visible { outline-offset: 3px; border-radius: var(--radius); }

  .card-img {
    background: var(--img-bg);
    aspect-ratio: 16 / 10;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }
  .card-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .img-count {
    position: absolute; right: 10px; bottom: 10px;
    font-family: 'IBM Plex Mono', monospace; font-size: 11px;
    background: rgba(0,0,0,0.6); color: #fff;
    padding: 2px 8px; border-radius: 100px;
  }
  .card-body { padding: 18px 20px 16px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
  .card-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .card-name { font-family: 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 8px; }
  .card-strap { font-size: 18px; font-weight: 500; line-height: 1.4; color: var(--text); flex: 1; letter-spacing: -0.1px; }
  .card-more { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--secondary); text-decoration: underline; text-underline-offset: 4px; text-decoration-color: var(--border-strong); }
  .card:hover .card-more { text-decoration-color: var(--text); color: var(--text); }
  .card-foot { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-top: auto; padding-top: 12px; border-top: 1px solid var(--faint); }

  /* featured: first work card spans the row */
  .card.featured { grid-column: 1 / -1; flex-direction: row; }
  .card.featured .card-img { flex: 0 0 56%; aspect-ratio: auto; min-height: 320px; }
  .card.featured .card-body { padding: 28px 30px 22px; gap: 14px; }
  .card.featured .card-strap { font-size: 24px; line-height: 1.3; flex: 0; }
  .card.featured .card-outcome { font-size: 16px; color: var(--secondary); flex: 1; }
  .card.featured.no-img .card-strap { max-width: 34ch; }
  .card.featured.no-img .card-outcome { max-width: 60ch; }

  /* home cards: tighter, no image */
  .card.compact .card-body { padding: 16px 18px 14px; gap: 8px; }
  .card.compact .card-name { font-size: 13px; }
  .card.compact .card-strap { font-size: 15px; font-weight: 400; color: var(--secondary); line-height: 1.5; }
  .card.compact .card-foot { padding-top: 10px; }
  .emoji { font-size: 16px; line-height: 1; }

  /* STATUS PILL */
  .pill {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    white-space: nowrap;
    display: inline-flex; align-items: center; gap: 6px;
    padding: 2px 9px 2px 8px;
    border-radius: 100px;
    border: 1px solid var(--border);
    color: var(--secondary);
  }
  .pill::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }
  .pill.s-live { color: var(--green); border-color: color-mix(in srgb, var(--green) 40%, transparent); }
  .pill.s-live::before { background: var(--green); }
  .pill.s-active { color: var(--amber); border-color: color-mix(in srgb, var(--amber) 40%, transparent); }
  .pill.s-active::before { background: var(--amber); }
  .pill.s-retired::before { background: transparent; border: 1px solid var(--muted); }
  .pill.s-retired { color: var(--muted); }

  .tag { font-family: 'IBM Plex Mono', monospace; font-size: 12px; padding: 3px 10px; background: var(--tag-bg); border-radius: 100px; color: var(--secondary); }

  /* METERS */
  .meters { display: flex; gap: 14px; }
  .meter { display: flex; flex-direction: column; gap: 4px; position: relative; }
  .meter-label { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--muted); }
  .meter-bar { display: flex; gap: 2px; }
  .meter-block { width: 10px; height: 10px; border-radius: 2px; background: var(--faint); }
  .meter-block.filled { background: var(--green-fill); }
  .meter-block.filled-amber { background: var(--amber-fill); }
  .meter-block.filled-red { background: var(--red-fill); }
  @media (hover: hover) {
    .meter[data-tip]::after {
      content: attr(data-tip);
      position: absolute;
      bottom: calc(100% + 8px);
      left: 0;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border-strong);
      padding: 4px 10px;
      border-radius: 6px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s;
      z-index: 5;
    }
    .meter[data-tip]:hover::after { opacity: 1; }
  }

  /* METER KEY */
  .meter-key { display: flex; flex-wrap: wrap; gap: 4px 20px; margin: -8px 0 24px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--secondary); }
  .meter-key b { font-weight: 500; color: var(--text); }

  /* CLOSING */
  .closing { font-size: 17px; line-height: 1.6; color: var(--text); max-width: 640px; }
  .closing a { font-weight: 500; text-underline-offset: 4px; text-decoration-color: var(--border-strong); }
  .closing a:hover { text-decoration-color: var(--text); }

  .footer { margin-top: 48px; padding-top: 20px; border-top: 1px solid var(--faint); font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--muted); }

  /* POPUP */
  .popup { position: fixed; inset: 0; z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 24px; visibility: hidden; opacity: 0; transition: opacity 0.2s ease, visibility 0s linear 0.2s; }
  .popup.active { visibility: visible; opacity: 1; transition: opacity 0.2s ease; }
  .popup-backdrop { position: absolute; inset: 0; background: rgba(10,10,10,0.6); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  .popup-panel {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: 0 24px 80px rgba(0,0,0,0.3);
    width: 100%; max-width: 760px; max-height: calc(100vh - 48px);
    overflow-y: auto; overscroll-behavior: contain;
    transform: translateY(12px); transition: transform 0.25s ease;
  }
  .popup.active .popup-panel { transform: none; }
  .popup-bar { position: sticky; top: 0; height: 0; z-index: 3; }
  .popup-close {
    position: absolute; top: 12px; right: 12px;
    width: 36px; height: 36px; border-radius: 50%;
    border: none; background: rgba(0,0,0,0.55); color: #fff;
    font-size: 20px; line-height: 1; cursor: pointer; z-index: 3;
  }
  .popup-close:hover { background: rgba(0,0,0,0.75); }

  .gallery { position: relative; background: var(--img-bg); aspect-ratio: 16 / 10; overflow: hidden; touch-action: pan-y; }
  .gallery-track { display: flex; height: 100%; transition: transform 0.3s ease; }
  .gallery-track img { flex: 0 0 100%; width: 100%; height: 100%; object-fit: contain; user-select: none; -webkit-user-drag: none; }
  .gallery-arrow {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 40px; height: 40px; border-radius: 50%; border: none;
    background: rgba(0,0,0,0.55); color: #fff; font-size: 20px; cursor: pointer;
  }
  .gallery-arrow:hover { background: rgba(0,0,0,0.75); }
  .gallery-arrow.prev { left: 12px; }
  .gallery-arrow.next { right: 12px; }
  .gallery-dots { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 4px; }
  .gallery-dot { width: 24px; height: 24px; border: none; background: none; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .gallery-dot::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.55); box-shadow: 0 0 0 1px rgba(0,0,0,0.25); }
  .gallery-dot[aria-current="true"]::before { background: #fff; }

  .popup-info { padding: 24px 30px 30px; display: flex; flex-direction: column; gap: 18px; }
  .popup-top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .popup-name { font-family: 'IBM Plex Mono', monospace; font-size: 16px; font-weight: 500; display: flex; align-items: center; gap: 8px; }
  .popup-info.no-gallery { padding-top: 28px; padding-right: 64px; }
  .popup-strap { font-size: 22px; font-weight: 500; line-height: 1.35; letter-spacing: -0.2px; max-width: 34ch; }
  .popup-bullets { list-style: none; display: flex; flex-direction: column; gap: 8px; }
  .popup-bullets li { position: relative; padding-left: 20px; color: var(--secondary); line-height: 1.55; }
  .popup-bullets li::before { content: ''; position: absolute; left: 2px; top: 0.7em; width: 8px; height: 2px; background: var(--border-strong); }
  .popup-desc { color: var(--secondary); line-height: 1.65; }
  .popup-outcome { font-weight: 500; line-height: 1.5; padding: 12px 16px; background: var(--tag-bg); border-radius: var(--radius-sm); }
  .popup-tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .popup-meters { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; padding-top: 16px; border-top: 1px solid var(--faint); }
  .popup-meters .meter-tip { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--secondary); line-height: 1.45; margin-top: 2px; }
  .popup-link { font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 500; }

  .loading { text-align: center; padding: 80px 0; color: var(--muted); font-family: 'IBM Plex Mono', monospace; font-size: 13px; }

  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }

  @media (max-width: 900px) {
    .grid-home { grid-template-columns: repeat(2, 1fr); }
    .card.featured { flex-direction: column; }
    .card.featured .card-img { flex: none; aspect-ratio: 16 / 10; min-height: 0; }
  }
  @media (max-width: 640px) {
    body { padding: 0 16px; }
    .page { padding: 40px 0 80px; }
    .header h1 { font-size: 24px; }
    .intro { margin-bottom: 48px; }
    .intro p { font-size: 16px; }
    .grid-work, .grid-home { grid-template-columns: 1fr; }
    .card-strap, .card.featured .card-strap { font-size: 18px; }
    .card.featured .card-body { padding: 18px 20px 16px; }
    .card-foot { flex-wrap: wrap; }
    .popup { padding: 0; }
    .popup-panel { max-width: none; height: 100%; max-height: none; border-radius: 0; border: none; }
    .popup-info { padding: 20px 20px 40px; }
    .popup-strap { font-size: 20px; }
    .popup-meters { grid-template-columns: 1fr; gap: 12px; }
    .popup-meters .meter { display: grid; grid-template-columns: 56px 1fr; align-items: center; gap: 2px 8px; }
    .popup-meters .meter-tip { grid-column: 2; margin-top: 0; }
    .gallery-arrow { display: none; }
  }
</style>
</head>
<body>

<div class="page" id="app">
  <div class="loading">loading...</div>
</div>

<div class="popup" id="popup" aria-hidden="true">
  <div class="popup-backdrop" data-close></div>
  <div class="popup-panel" role="dialog" aria-modal="true" aria-labelledby="popup-name" tabindex="-1">
    <div class="popup-bar"><button class="popup-close" data-close aria-label="Close">×</button></div>
    <div id="popup-body"></div>
  </div>
</div>

<script>
const DATA_PATH = './projects.json';
let DATA = null;
let lastFocus = null;
let gallery = { index: 0, count: 0 };

async function init() {
  const res = await fetch(DATA_PATH);
  DATA = await res.json();
  document.title = DATA.site.title;
  document.getElementById('app').innerHTML = render(DATA);
  wireUp();
  openFromHash();
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// accepts the new images: [] and the old single image field
function imagesOf(p) {
  if (Array.isArray(p.images)) return p.images.filter(Boolean);
  return p.image ? [p.image] : [];
}

function effortClass(score) {
  if (score <= 2) return 'filled'; // green = quick
  if (score <= 3) return 'filled-amber';
  return 'filled-red'; // 4-5 = marathon
}

function blocks(score, type) {
  const cls = type === 'effort' ? effortClass(score) : 'filled';
  return Array.from({ length: 5 }, (_, i) =>
    `<div class="meter-block ${i < score ? cls : ''}"></div>`
  ).join('');
}

const METERS = ['effort', 'value', 'usage'];

function meters(p) {
  return `<div class="meters">${METERS.map(k => `
    <div class="meter" data-tip="${esc(p[k].tip)}" aria-label="${k} ${p[k].score} of 5: ${esc(p[k].tip)}">
      <span class="meter-label">${k}</span>
      <div class="meter-bar">${blocks(p[k].score, k)}</div>
    </div>`).join('')}</div>`;
}

function pill(p) {
  const cls = { live: 's-live', active: 's-active', retired: 's-retired' }[p.status] || 's-shipped';
  return `<span class="pill ${cls}">${esc(p.statusLabel)}</span>`;
}

function cardAttrs(p, extra) {
  return `class="card ${extra}" role="button" tabindex="0" data-id="${esc(p.id)}" aria-label="${esc(p.name)}: ${esc(p.strapline)}. Open details"`;
}

function nameWithEmoji(p) {
  return `<span class="card-name"><span class="emoji" aria-hidden="true">${p.emoji}</span>${esc(p.name)}</span>`;
}

function renderWorkCard(p, i) {
  const imgs = imagesOf(p);
  // no screenshots: no image area at all; it comes back when images are added
  const img = imgs.length
    ? `<div class="card-img"><img src="${esc(imgs[0])}" alt="" loading="lazy">${imgs.length > 1 ? `<span class="img-count">1 / ${imgs.length}</span>` : ''}</div>`
    : '';
  const featured = i === 0;
  return `
    <article ${cardAttrs(p, (featured ? 'featured ' : '') + (imgs.length ? '' : 'no-img'))}>
      ${img}
      <div class="card-body">
        <div class="card-top">${nameWithEmoji(p)}${pill(p)}</div>
        <p class="card-strap">${esc(p.strapline)}</p>
        ${featured && p.outcome ? `<p class="card-outcome">${esc(p.outcome)}</p>` : ''}
        <div class="card-foot">${meters(p)}<span class="card-more">details</span></div>
      </div>
    </article>`;
}

function renderHomeCard(p) {
  return `
    <article ${cardAttrs(p, 'compact')}>
      <div class="card-body">
        <div class="card-top">${nameWithEmoji(p)}${pill(p)}</div>
        <p class="card-strap">${esc(p.strapline || p.description)}</p>
        <div class="card-foot">${meters(p)}</div>
      </div>
    </article>`;
}

function simpleMarkdown(text) {
  return text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
}

function meterKey(text) {
  if (!text) return '';
  return `<p class="meter-key">${text.split(' · ').map(part => {
    const [term, ...rest] = part.split(' = ');
    return rest.length ? `<span><b>${esc(term)}</b> = ${esc(rest.join(' = '))}</span>` : `<span>${esc(part)}</span>`;
  }).join('')}</p>`;
}

function render(data) {
  const s = data.site;
  const sections = data.sections || {};
  const work = data.projects.filter(p => p.section === 'work');
  const home = data.projects.filter(p => p.section !== 'work');
  const head = (key, fallback) => {
    const sec = sections[key] || { title: fallback };
    return `<div class="section-head"><h2 class="section-title">${esc(sec.title)}</h2>${sec.framing ? `<p class="section-framing">${esc(sec.framing)}</p>` : ''}</div>`;
  };
  return `
    <header class="header">
      <h1>${esc(s.title)}</h1>
      <div class="tagline">${esc(s.tagline)}</div>
      <div class="meta">
        <span>${esc(s.name)} · ${esc(s.role)}</span>
        <span><a href="mailto:${esc(s.email)}">${esc(s.email)}</a></span>
        <span><a href="${esc(s.github)}">github</a></span>
      </div>
    </header>

    <div class="intro">${data.intro.split(/\n\n+/).map(para => `<p>${esc(para)}</p>`).join('')}</div>

    <section class="section">
      ${head('work', 'at work')}
      ${meterKey((sections.work || {}).key)}
      <div class="grid grid-work">${work.map(renderWorkCard).join('')}</div>
    </section>

    <section class="section">
      ${head('home', 'at home')}
      <div class="grid grid-home">${home.map(renderHomeCard).join('')}</div>
    </section>

    ${data.closing ? `<p class="closing">${simpleMarkdown(esc(data.closing))}</p>` : ''}

    <footer class="footer">last updated: ${esc(s.updated)} · built with claude code, obviously</footer>
  `;
}

/* ---------- popup ---------- */

function renderPopup(p) {
  const imgs = imagesOf(p);
  let galleryHtml;
  if (!imgs.length) {
    galleryHtml = '';
  } else {
    const multi = imgs.length > 1;
    galleryHtml = `
      <div class="gallery" id="gallery" aria-roledescription="carousel" aria-label="${esc(p.name)} screenshots">
        <div class="gallery-track" id="gallery-track">
          ${imgs.map((src, i) => `<img src="${esc(src)}" alt="${esc(p.name)} screenshot ${i + 1} of ${imgs.length}" draggable="false">`).join('')}
        </div>
        ${multi ? `
          <button class="gallery-arrow prev" data-step="-1" aria-label="Previous screenshot">‹</button>
          <button class="gallery-arrow next" data-step="1" aria-label="Next screenshot">›</button>
          <div class="gallery-dots">${imgs.map((_, i) => `<button class="gallery-dot" data-go="${i}" aria-label="Screenshot ${i + 1}"></button>`).join('')}</div>` : ''}
      </div>`;
  }

  const body = p.bullets && p.bullets.length
    ? `<ul class="popup-bullets">${p.bullets.map(b => `<li>${esc(b)}</li>`).join('')}</ul>`
    : (p.description ? `<p class="popup-desc">${esc(p.description)}</p>` : '');
  const link = p.link ? `<a class="popup-link" href="${esc(p.link.url)}">${esc(p.link.label)}</a>` : '';

  return `
    ${galleryHtml}
    <div class="popup-info${imgs.length ? '' : ' no-gallery'}">
      <div class="popup-top"><span class="popup-name" id="popup-name">${imgs.length ? '' : `<span class="emoji" aria-hidden="true">${p.emoji}</span>`}${esc(p.name)}</span>${pill(p)}</div>
      <p class="popup-strap">${esc(p.strapline)}</p>
      ${body}
      ${p.outcome ? `<p class="popup-outcome">${esc(p.outcome)}</p>` : ''}
      ${p.tags && p.tags.length ? `<div class="popup-tags">${p.tags.map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>` : ''}
      <div class="popup-meters">${METERS.map(k => `
        <div class="meter">
          <span class="meter-label">${k}</span>
          <div class="meter-bar" aria-label="${k} ${p[k].score} of 5">${blocks(p[k].score, k)}</div>
          <span class="meter-tip">${esc(p[k].tip)}</span>
        </div>`).join('')}</div>
      ${link}
    </div>`;
}

function openPopup(id, { updateHash = true } = {}) {
  const p = DATA.projects.find(x => x.id === id);
  if (!p) return;
  lastFocus = document.activeElement;
  document.getElementById('popup-body').innerHTML = renderPopup(p);
  gallery = { index: 0, count: imagesOf(p).length };
  setSlide(0);
  const popup = document.getElementById('popup');
  popup.classList.add('active');
  popup.setAttribute('aria-hidden', 'false');
  document.body.style.overflow = 'hidden';
  const panel = popup.querySelector('.popup-panel');
  panel.scrollTop = 0;
  panel.focus({ preventScroll: true });
  if (updateHash) history.replaceState(null, '', '#' + id);
}

function closePopup() {
  const popup = document.getElementById('popup');
  if (!popup.classList.contains('active')) return;
  popup.classList.remove('active');
  popup.setAttribute('aria-hidden', 'true');
  document.body.style.overflow = '';
  history.replaceState(null, '', location.pathname + location.search);
  if (lastFocus) lastFocus.focus({ preventScroll: true });
}

function setSlide(i) {
  if (!gallery.count) return;
  gallery.index = (i + gallery.count) % gallery.count;
  const track = document.getElementById('gallery-track');
  if (track) track.style.transform = `translateX(-${gallery.index * 100}%)`;
  document.querySelectorAll('.gallery-dot').forEach((d, n) => d.setAttribute('aria-current', n === gallery.index ? 'true' : 'false'));
}

function openFromHash() {
  const id = decodeURIComponent(location.hash.slice(1));
  if (id) openPopup(id, { updateHash: false });
}

function wireUp() {
  const app = document.getElementById('app');
  app.addEventListener('click', e => {
    const card = e.target.closest('.card');
    if (card) openPopup(card.dataset.id);
  });
  app.addEventListener('keydown', e => {
    const card = e.target.closest('.card');
    if (card && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openPopup(card.dataset.id); }
  });

  const popup = document.getElementById('popup');
  popup.addEventListener('click', e => {
    if (e.target.closest('[data-close]')) return closePopup();
    const step = e.target.closest('[data-step]');
    if (step) return setSlide(gallery.index + Number(step.dataset.step));
    const go = e.target.closest('[data-go]');
    if (go) return setSlide(Number(go.dataset.go));
  });

  // swipe
  let startX = null, startY = null;
  popup.addEventListener('touchstart', e => {
    if (!e.target.closest('.gallery')) return;
    startX = e.touches[0].clientX; startY = e.touches[0].clientY;
  }, { passive: true });
  popup.addEventListener('touchend', e => {
    if (startX === null) return;
    const dx = e.changedTouches[0].clientX - startX;
    const dy = e.changedTouches[0].clientY - startY;
    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) setSlide(gallery.index + (dx < 0 ? 1 : -1));
    startX = null;
  });

  document.addEventListener('keydown', e => {
    if (!popup.classList.contains('active')) return;
    if (e.key === 'Escape') closePopup();
    else if (e.key === 'ArrowRight') setSlide(gallery.index + 1);
    else if (e.key === 'ArrowLeft') setSlide(gallery.index - 1);
    else if (e.key === 'Tab') {
      const f = [...popup.querySelectorAll('button, a[href], [tabindex="0"]')];
      if (!f.length) return;
      const first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });

  window.addEventListener('hashchange', () => location.hash ? openFromHash() : closePopup());
}

init();
</script>

</body>
</html>
